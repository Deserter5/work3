<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Контакти — Математичний факультет ЗНУ</title>
    <link rel="shortcut icon" href="./image/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
    <header class="header">
        <div class="wrapper">
            <div class="header__wrapper">
                <div class="wrapper__logo">
                    <a href="./index.html" class="wrapper__logo-link">
                        <img src="./image/logo.png" alt="Логотип ЗНУ" width="64" height="64" class="wrapper__logo-pic" />
                    </a>
                </div>

                <nav class="header__nav">
                    <ul class="header__list-menu">
                        <li class="header__item">
                            <a href="./index.html" class="header__link">Головна</a>
                        </li>
                        <li class="header__item">
                            <a href="./news.html" class="header__link">Новини</a>
                            <ul class="header__submenu">
                                <li><a href="./news.html#events" class="header__submenu-link">Події факультету</a></li>
                                <li><a href="./news.html#science" class="header__submenu-link">Наука та ІТ</a></li>
                            </ul>
                        </li>
                        <li class="header__item">
                            <a href="./education.html" class="header__link">Навчання</a>
                            <ul class="header__submenu">
                                <li><a href="./education.html#schedule" class="header__submenu-link">Розклад занять</a></li>
                                <li><a href="./index.html#directions" class="header__submenu-link">Напрями підготовки</a></li>
                            </ul>
                        </li>
                        <li class="header__item">
                            <a href="./contacts.html" class="header__link header__link--active">Контакти</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <h1>Контакти та зворотний зв’язок</h1>
        <hr />

        <div class="contact-form-box">
            <form action="#" method="post">
                <div class="form-group">
                    <label for="user-name">Ім’я</label>
                    <input type="text" id="user-name" name="name" placeholder="Ваше ім’я" required />
                </div>

                <div class="form-group">
                    <label for="user-email">Email</label>
                    <input type="email" id="user-email" name="email" placeholder="Ваш email" required />
                </div>

                <div class="form-group">
                    <label for="user-message">Повідомлення</label>
                    <textarea id="user-message" name="message" rows="5" placeholder="Ваше повідомлення" required></textarea>
                </div>

                <button type="submit" class="btn-submit">Надіслати</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="wrapper footer__wrapper">
            <img src="./image/logo.png" alt="Логотип ЗНУ" width="52" height="52" class="footer__logo" />
            <p>&copy; 2025 Математичний факультет ЗНУ. Всі права захищено.</p>
        </div>
    </footer>
</body>
</html>
